[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mkbot"
version = "0.1.0a1"
description = "A persistent character runtime with accountable autonomous activities."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "mkroen" }]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.scripts]
mkbot = "mkbot.cli:main"

[project.urls]
Homepage = "https://github.com/mkroen/mkbot"
Repository = "https://github.com/mkroen/mkbot"
Issues = "https://github.com/mkroen/mkbot/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mkbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
